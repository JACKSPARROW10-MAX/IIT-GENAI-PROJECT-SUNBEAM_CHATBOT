name: Weekly Data Scraping & RAG Update

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 0"   # Every Sunday 6:00 AM IST
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Environment
        env:
          CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
          NEW_GROQ_KEY: ${{ secrets.NEW_GROQ_KEY }}
        run: |
          echo "Checking secret availability..."
          if [ -z "$CHROMA_API_KEY" ]; then echo "⚠️ CHROMA_API_KEY is missing"; else echo "✅ CHROMA_API_KEY is present"; fi
          if [ -z "$NEW_GROQ_KEY" ]; then echo "⚠️ NEW_GROQ_KEY is missing"; else echo "✅ NEW_GROQ_KEY is present"; fi

      - name: Run Full Ingestion Pipeline
        env:
          CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}
          NEW_GROQ_KEY: ${{ secrets.NEW_GROQ_KEY }}
        run: |
          # Use the centralized coordinator script
          python RAG_Model/run_all_scrap.py
